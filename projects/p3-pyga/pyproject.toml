[project]
name = "p3-pyga"
version = "0.1.0"
description = "Project 3 — genetic algorithm with PyGAD, benchmarks vs P1/P2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "pygad",
    "ga-core",
    "p1-binary",
    "p2-real",
]

[project.scripts]
p3-pyga = "p3_pyga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p3_pyga"]

[tool.uv.sources]
ga-core = { workspace = true }
p1-binary = { workspace = true }
p2-real = { workspace = true }
