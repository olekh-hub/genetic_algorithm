[project]
name = "ga-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask", "flask-cors", "ga-core", "p1-binary", "p2-real"]

[project.scripts]
ga-app = "ga_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga_app"]

[tool.uv.sources]
ga-core = { workspace = true }
p1-binary = { workspace = true }
p2-real = { workspace = true }
